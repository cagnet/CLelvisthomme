<div class="container mx-auto p-5">
    <h1 class="text-2xl font-bold pb-5">Dashboard</h1>

    @if(loading()){
    <span class="loading loading-spinner loading-lg" aria-label="Loading dashboard"></span>
    }@else {@if(error()){
    <div role="alert" class="alert alert-error">
        <span>{{error()}}</span>
    </div>
    }@else {
    <div class="stats stats-vertical lg:stats-horizontal shadow w-full">
        <div class="stat">
            <div class="stat-title">Active customers</div>
            <div class="stat-value text-success">{{activeCount()}}</div>
        </div>
        <div class="stat">
            <div class="stat-title">Inactive customers</div>
            <div class="stat-value">{{inactiveCount()}}</div>
        </div>
        <div class="stat">
            <div class="stat-title">Orders</div>
            <div class="stat-value">{{orderCount()}}</div>
        </div>
        <div class="stat">
            <div class="stat-title">Total amount</div>
            <div class="stat-value">{{totalAmount() | currency: 'EUR'}}</div>
        </div>
        <div class="stat">
            <div class="stat-title">Average amount</div>
            <div class="stat-value">{{averageAmount() | currency: 'EUR'}}</div>
        </div>
    </div>
    }}
</div>
